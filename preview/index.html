<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>肥鱼大冒险 · Deepsea</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#153d59;display:grid;place-items:center;height:100dvh;overflow:hidden;font-family:Arial,'Microsoft YaHei',sans-serif}
canvas{width:min(100vw,56.25dvh);height:min(177.778vw,100dvh);touch-action:none;display:block;box-shadow:0 0 80px #082c47}
#status{position:fixed;bottom:8px;left:12px;color:#b4ebf4;font:12px sans-serif;pointer-events:none}
@media(max-width:740px){#status{display:none}}
</style>
<canvas id="game" width="720" height="1280" aria-label="肥鱼大冒险，滑动或方向键移动，回车开始" tabindex="0"></canvas>
<div id="status">Cocos 共用规则与画面预览 · 方向键 / 鼠标 / 触屏 · Enter 开始</div>
<div id="nav" style="position:fixed;top:8px;right:12px;font:12px sans-serif"><a href="/zombie-gate" style="color:#9dffb0">新模式预览</a></div>
<script src="/game.js"></script>
<script>
const { FishRushModel, composeGame } = FishRush;
const model = new FishRushModel();
const canvas = document.getElementById('game'), ctx=canvas.getContext('2d');
const images = {}, keys=new Set();
let ready=false, last=0, down=false, hover=null;
Promise.all(['fish','squirrel'].map(key=>new Promise((resolve,reject)=>{
 const image=new Image();image.onload=()=>{images[key]=image;resolve()};image.onerror=reject;
 image.src='/assets/resources/art/'+(key==='fish'?'deepseek-fish':'faker-squirrel')+'.png';
}))).then(()=>ready=true).catch(()=>document.getElementById('status').textContent='角色资源加载失败，请刷新');
function draw(c){
 ctx.save();ctx.fillStyle=c.fill||'#ffffff';ctx.strokeStyle=c.stroke||'#153d59';ctx.lineWidth=c.line||1;
 const x=c.x||0,y=c.y||0,w=c.w||1,h=c.h||1;
 if(c.kind==='text'){
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${c.bold?'700':'400'} ${c.size}px Arial,"Microsoft YaHei",sans-serif`;
  ctx.fillText(c.text,x,y);
 } else if(c.kind==='image'){
  if(images[c.asset])ctx.drawImage(images[c.asset],x-w/2,y-h/2,w,h);
 } else {
  ctx.beginPath();
  if(c.kind==='rect')ctx.roundRect(x-w/2,y-h/2,w,h,Math.min(c.radius||0,w/2,h/2));
  else if(c.kind==='ellipse')ctx.ellipse(x,y,w/2,h/2,0,0,Math.PI*2);
  else {c.points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();}
  ctx.fill();if(c.stroke)ctx.stroke();
 }ctx.restore();
}
function start(){if(ready&&model.phase!=='playing')model.start(model.phase==='won'?model.stage+1:model.stage)}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*720/r.width,y:(e.clientY-r.top)*1280/r.height}}
canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId);canvas.focus();const p=point(e);hover=p;if(model.phase==='playing')model.steer((p.x-360)/294)});
canvas.addEventListener('pointermove',e=>{const p=point(e);hover=p;if(e.pointerType==='mouse'||down)model.steer((p.x-360)/294)});
canvas.addEventListener('pointerup',e=>{down=false;const p=point(e);if(p.x>=124&&p.x<=596&&p.y>=812&&p.y<=898)start()});
canvas.addEventListener('pointercancel',()=>down=false);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Enter','a','d','A','D'].includes(e.key)){e.preventDefault();keys.add(e.key);if(e.key==='Enter'||e.key===' ')start()}});
window.addEventListener('keyup',e=>keys.delete(e.key));
window.addEventListener('blur',()=>{keys.clear();down=false});
document.addEventListener('visibilitychange',()=>{last=0;keys.clear()});
function frame(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;
 const right=keys.has('ArrowRight')||keys.has('d')||keys.has('D'),left=keys.has('ArrowLeft')||keys.has('a')||keys.has('A');
 if(model.phase==='playing'&&(right||left))model.steer(model.targetX+(Number(right)-Number(left))*dt*2.2);
 model.tick(dt);ctx.clearRect(0,0,720,1280);
 const commands=composeGame(model,hover);if(!ready){const b=commands.find(c=>c.id==='buttonText');if(b)b.text='LOADING'}
 commands.forEach(draw);requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script>
</html>
