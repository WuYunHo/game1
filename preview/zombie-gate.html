<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>向僵尸开炮 · 前期战斗预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1c24;display:grid;place-items:center;height:100dvh;overflow:hidden;font-family:Arial,'Microsoft YaHei',sans-serif}
canvas{width:min(100vw,56.25dvh);height:min(177.778vw,100dvh);touch-action:none;display:block;box-shadow:0 0 80px #041018}
#status{position:fixed;bottom:8px;left:12px;color:#9ec8d4;font:12px sans-serif;pointer-events:none}
#nav{position:fixed;top:8px;right:12px;font:12px sans-serif}
#nav a{color:#7fd0e0;margin-left:10px}
@media(max-width:740px){#status,#nav{display:none}}
</style>
<canvas id="game" width="720" height="1280" aria-label="前期战斗，左右换道，回车开始" tabindex="0"></canvas>
<div id="status">格子地图 · 门静止 · 发现后追击 · ←→ / A D 换道 · Enter 开始</div>
<div id="nav"><a href="/">旧版肥鱼</a></div>
<script src="/zombie-gate.js"></script>
<script>
const { ZombieGateModel, composeZombieGate, laneFromX } = ZombieGate;
const model = new ZombieGateModel();
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const images = {}, keys = new Set();
let ready = false, last = 0, down = false, hover = null, laneCool = 0;
Promise.all(['fish','squirrel'].map(key => new Promise((resolve, reject) => {
  const image = new Image();
  image.onload = () => { images[key] = image; resolve(); };
  image.onerror = reject;
  image.src = '/assets/resources/art/' + (key === 'fish' ? 'deepseek-fish' : 'faker-squirrel') + '.png';
}))).then(() => ready = true).catch(() => {
  document.getElementById('status').textContent = '角色资源加载失败，请刷新';
});
function draw(c) {
  ctx.save();
  ctx.globalAlpha = c.alpha == null ? 1 : Math.max(0, Math.min(1, c.alpha));
  ctx.fillStyle = c.fill || '#ffffff';
  ctx.strokeStyle = c.stroke || '#153d59';
  ctx.lineWidth = c.line || 1;
  const x = c.x || 0, y = c.y || 0, w = c.w || 1, h = c.h || 1;
  if (c.kind === 'text') {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${c.bold ? '700' : '400'} ${c.size}px Arial,"Microsoft YaHei",sans-serif`;
    ctx.fillText(c.text, x, y);
  } else if (c.kind === 'image') {
    if (images[c.asset]) ctx.drawImage(images[c.asset], x - w / 2, y - h / 2, w, h);
    else {
      ctx.beginPath();
      ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (c.kind === 'line') {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(c.x2, c.y2);
    ctx.stroke();
  } else if (c.kind === 'graphicsBatch' && c.graphicsCommands) {
    for (const sub of c.graphicsCommands) draw(sub);
  } else {
    ctx.beginPath();
    if (c.kind === 'rect') {
      const r = Math.min(c.radius || 0, w / 2, h / 2);
      if (r > 0) ctx.roundRect(x - w / 2, y - h / 2, w, h, r);
      else ctx.rect(x - w / 2, y - h / 2, w, h);
    } else if (c.kind === 'ellipse') ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    if (c.stroke) ctx.stroke();
  }
  ctx.restore();
}
function start() {
  if (ready && model.phase !== 'playing') model.start(model.stage);
}
function point(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * 720 / r.width, y: (e.clientY - r.top) * 1280 / r.height };
}
canvas.addEventListener('pointerdown', e => {
  down = true; canvas.setPointerCapture(e.pointerId); canvas.focus();
  const p = point(e); hover = p;
  if (model.phase === 'playing') model.setLane(laneFromX(p.x));
});
canvas.addEventListener('pointermove', e => {
  const p = point(e); hover = p;
  if ((e.pointerType === 'mouse' || down) && model.phase === 'playing') model.setLane(laneFromX(p.x));
});
canvas.addEventListener('pointerup', e => {
  down = false;
  const p = point(e);
  if (p.x >= 124 && p.x <= 596 && p.y >= 812 && p.y <= 898) start();
});
canvas.addEventListener('pointercancel', () => down = false);
window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight',' ','Enter','a','d','A','D'].includes(e.key)) {
    e.preventDefault();
    keys.add(e.key);
    if (e.key === 'Enter' || e.key === ' ') start();
  }
});
window.addEventListener('keyup', e => keys.delete(e.key));
window.addEventListener('blur', () => { keys.clear(); down = false; });
document.addEventListener('visibilitychange', () => { last = 0; keys.clear(); });
function frame(t) {
  const dt = last ? Math.min((t - last) / 1000, 0.05) : 0;
  last = t;
  laneCool = Math.max(0, laneCool - dt);
  const right = keys.has('ArrowRight') || keys.has('d') || keys.has('D');
  const left = keys.has('ArrowLeft') || keys.has('a') || keys.has('A');
  if (model.phase === 'playing' && laneCool <= 0 && (right || left) && !(right && left)) {
    model.shiftLane(right ? 1 : -1);
    laneCool = 0.12;
  }
  model.tick(dt);
  ctx.clearRect(0, 0, 720, 1280);
  const commands = composeZombieGate(model, hover);
  if (!ready) {
    const b = commands.find(c => c.id === 'buttonText');
    if (b) b.text = 'LOADING';
  }
  commands.forEach(draw);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
